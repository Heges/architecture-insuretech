type Query {
  # GET /clients/{id}
  client(id: ID!): Client
}

type Client {
  id: ID
  name: String
  age: Int

  # GET /clients/{id}/documents
  documents: [Document]

  # GET /clients/{id}/relatives
  relatives: [Relative]
}

type Document {
  id: ID
  type: String
  number: String
  issueDate: String
  expiryDate: String
}

type Relative {
  id: ID
  relationType: String
  name: String
  age: Int
}
